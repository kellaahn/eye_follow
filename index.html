<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eye Follow</title>
  <script>
    // 기기에 따라 버전 선택: 휴대폰·태블릿 → mobile/, 컴퓨터 → v1/
    // 강제로 고르려면 ?view=mobile 또는 ?view=web
    (function () {
      var q = new URLSearchParams(location.search).get('view');
      var ua = navigator.userAgent;
      var isMobile =
        /Android|iPhone|iPad|iPod|Mobile/i.test(ua) ||
        // iPadOS 는 Mac 처럼 보이므로 터치 지원 여부로 구분
        (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      if (q === 'mobile') isMobile = true;
      if (q === 'web') isMobile = false;
      location.replace(isMobile ? 'mobile/' : 'v1/');
    })();
  </script>
</head>
<body>
  <p><a href="mobile/">모바일 버전</a> · <a href="v1/">웹 버전</a></p>
</body>
</html>
